<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#18181b">
<title>Размещение книг</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<style>
:root{--bg:#f4f4f2;--card:#fff;--ink:#18181b;--quiet:#52525b;--line:#e4e4e0;--dark:#18181b;
--ok-bg:#dcfce7;--ok:#15803d;--ok-ink:#14532d;--info-bg:#dbeafe;--info:#1d4ed8;--info-ink:#1e3a8a;
--warn-bg:#fef3c7;--warn:#b45309;--warn-ink:#78350f;--bad-bg:#fee2e2;--bad:#b91c1c;--bad-ink:#7f1d1d;--gray-bg:#ededea;--gray:#71717a}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:Roboto,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;color:inherit}
.hidden{display:none!important}
#app{min-height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;background:#fff;border-bottom:1px solid var(--line)}
.who{font-weight:700;font-size:16px}
.sync{font-size:14px;color:var(--quiet);text-align:right}
.sync.off{color:var(--warn-ink);font-weight:700}
.sync.bad{color:var(--bad);font-weight:700}
.infobar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:4px 12px;background:#fff;border-bottom:1px solid var(--line);min-height:44px}
.infobar.test{background:var(--warn-bg);border-bottom-color:var(--warn)}
.infobar .tbl{font-size:13px;color:var(--quiet);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.infobar.test .tbl{color:var(--warn-ink);font-weight:800;font-size:15px;letter-spacing:.03em}
.cat.stale{background:var(--warn-bg);border-color:var(--warn);color:var(--warn-ink)}
.cat{flex:none;height:36px;padding:0 12px;border:1px solid #d4d4cf;border-radius:10px;background:#fff;font-size:14px;font-weight:600}
.modes{display:flex;gap:8px;padding:8px 12px 0}
.modes button{flex:1;height:48px;border:1px solid #d4d4cf;border-radius:12px;background:#fff;font-size:16px;font-weight:600}
.modes button.on{background:var(--dark);border-color:var(--dark);color:#fff}
.cellbar{display:flex;align-items:center;justify-content:space-between;margin:8px 12px 0;padding:10px 14px;background:var(--dark);color:#fff;border-radius:14px}
.cellbar small{display:block;font-size:13px;color:#d4d4d8}
.cellbar .cell{font-size:34px;font-weight:800;letter-spacing:.02em}
.cellside{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.done{height:44px;padding:0 16px;border:0;border-radius:10px;background:#fff;color:var(--dark);font-size:16px;font-weight:800}
.status{margin:10px 12px 0;border-radius:14px;padding:12px 14px;border:2px solid var(--line);background:#fff;display:flex;flex-direction:column;gap:6px}
.status .lbl{font-size:15px;font-weight:800;letter-spacing:.04em}
.status .big{font-size:30px;font-weight:800}
.status .title{font-size:20px;font-weight:700;line-height:1.25}
.status .meta{font-size:15px;color:var(--quiet)}
.status .note{font-size:15px;font-weight:600}
.s-ok{background:var(--ok-bg);border-color:var(--ok)}.s-ok .lbl{color:var(--ok-ink)}
.s-info{background:var(--info-bg);border-color:var(--info)}.s-info .lbl{color:var(--info-ink)}
.s-warn{background:var(--warn-bg);border-color:var(--warn)}.s-warn .lbl{color:var(--warn-ink)}
.s-bad{background:var(--bad-bg);border-color:var(--bad);border-width:3px}.s-bad .lbl,.s-bad .big{color:var(--bad-ink)}
.s-gray{background:var(--gray-bg);border-color:var(--gray)}
.sec{padding:12px 12px 6px;display:flex;justify-content:space-between;align-items:baseline}
.sec b{font-size:17px}.sec span{font-size:14px;color:var(--quiet)}
.grid{padding:0 12px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.grid button,.wide{height:56px;border:1px solid #d4d4cf;border-radius:12px;background:#fff;font-size:15px;font-weight:600}
.grid button.sel,.wide.sel{background:var(--info);border:3px solid var(--info);color:#fff;font-weight:800}
.grid button.from-table{outline:3px dashed var(--ok);outline-offset:-6px}
.wide{width:calc(100% - 24px);margin:8px 12px 0;border-style:dashed;border-width:2px;font-size:17px;font-weight:700}
.hint{padding:8px 16px 0;font-size:15px;color:#3f3f46;text-align:center;line-height:1.4}
.actions{display:flex;flex-direction:column;gap:12px;padding:12px}
.primary{height:68px;border:0;border-radius:16px;background:var(--dark);color:#fff;font-size:19px;font-weight:800}
.secondary{height:56px;border:2px solid #a1a1aa;border-radius:14px;background:#fff;font-size:15px;font-weight:600;color:#3f3f46;position:relative;overflow:hidden}
.secondary .fill{position:absolute;left:0;top:0;bottom:0;width:0;background:rgba(185,28,28,.18)}
.shelf{margin:8px 12px 0;background:#fff;border-radius:14px;padding:0 4px 0 14px}
.shelf .row{display:flex;align-items:center;gap:10px;min-height:60px;border-bottom:1px solid #ededea}
.shelf .row:last-child{border-bottom:0}
.shelf .row.bad b{color:var(--bad-ink)}.shelf .row.bad span{color:var(--bad);font-weight:700;white-space:normal}
.shelf .row.cur{margin-left:-14px;padding-left:10px;border-left:4px solid var(--ok);background:#f0fdf4;border-radius:10px 0 0 10px}
.shelf .row.cur span{color:var(--ok);font-weight:600}
.shelf .row div{flex:1;min-width:0}
.shelf .row b{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.shelf .row span{font-size:14px;color:var(--quiet)}
.shelf .row button{width:104px;height:48px;border:1px solid #d4d4cf;border-radius:12px;background:#fff;font-size:15px;font-weight:600}
.spacer{flex:1}
.bottom{position:sticky;bottom:0;display:flex;gap:10px;padding:12px;background:#fff;border-top:1px solid var(--line)}
.undo{flex:1;height:56px;border:2px solid var(--bad);border-radius:12px;background:#fff;color:var(--bad);font-size:16px;font-weight:700}
.cam-btn{width:100px;height:56px;border:1px solid #d4d4cf;border-radius:12px;background:#fff;font-size:16px;font-weight:600}
.cam{position:fixed;inset:0;background:#000;z-index:20;display:flex;flex-direction:column}
.cam video{flex:1;width:100%;object-fit:cover;min-height:0}
.cam .frame{position:absolute;left:8%;right:8%;top:35%;height:22%;border:3px solid #fff;border-radius:14px;box-shadow:0 0 0 2000px rgba(0,0,0,.35)}
.cam .bar{padding:14px;display:flex;flex-direction:column;gap:10px;background:#18181b}
.cam .bar p{margin:0;color:#e4e4e7;font-size:16px;text-align:center}
.cam .bar button{height:56px;border:0;border-radius:12px;background:#fff;font-size:17px;font-weight:700}
.menu-btn{width:90px;height:56px;border:1px solid #d4d4cf;border-radius:12px;background:#fff;font-size:16px;font-weight:600}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet .box{width:100%;max-width:560px;background:var(--bg);border-radius:18px 18px 0 0;padding:16px;display:flex;flex-direction:column;gap:12px}
.sheet h2{margin:0;font-size:19px}
.step{background:#fff;border-radius:14px;padding:10px 12px;display:flex;align-items:center;gap:10px}
.step label{width:82px;font-size:18px;font-weight:600}
.step button{width:64px;height:64px;border:1px solid #d4d4cf;border-radius:14px;background:var(--bg);font-size:30px;font-weight:700}
.step input{flex:1;min-width:0;height:64px;border:2px solid #d4d4cf;border-radius:14px;text-align:center;font-size:30px;font-weight:800;background:#fff}
.mmsg{margin:0;min-height:0;color:var(--bad-ink);font-weight:700;font-size:15px}.mmsg:empty{display:none}
.row2{display:flex;gap:10px}.row2 button{height:60px;border-radius:14px;font-size:17px;font-weight:700}
.row2 .ok{flex:1;border:0;background:var(--ok);color:#fff}.row2 .back{width:130px;border:1px solid #d4d4cf;background:#fff}
.menu button{height:56px;border:1px solid #d4d4cf;border-radius:12px;background:#fff;font-size:16px;font-weight:600;text-align:left;padding:0 16px}
.setup{padding:24px 16px;display:flex;flex-direction:column;gap:14px}
.setup h1{margin:0;font-size:24px}.setup p{margin:0;color:var(--quiet);line-height:1.45}
.setup input{height:56px;border:2px solid #d4d4cf;border-radius:12px;padding:0 14px;font-size:16px}
.problems{margin:8px 12px 0;padding:10px 14px;background:var(--bad-bg);border-radius:14px;font-size:14px;color:var(--bad-ink)}
#scan{position:fixed;left:-1000px;top:0;width:10px;height:10px;opacity:0}
</style>
</head>
<body>
<div id="app">
  <section id="setupView" class="setup hidden">
    <h1>Размещение книг</h1>
    <p>Вставьте ключ устройства (его даёт владелица из настроек таблицы). Ключ вводится один раз.</p>
    <input id="keyInput" autocomplete="off" placeholder="Ключ устройства" aria-label="Ключ устройства">
    <button id="keySave" class="primary" type="button">Проверить и сохранить</button>
    <p id="keyMsg"></p>
  </section>

  <section id="mainView" class="hidden" style="display:flex;flex-direction:column;min-height:100vh">
    <div class="top">
      <span class="who" id="who"></span>
      <span class="sync" id="sync"></span>
    </div>
    <div class="infobar" id="infobar">
      <span class="tbl" id="tblName"></span>
      <button id="catBtn" class="cat" type="button">Справочник ↻</button>
    </div>
    <div class="modes">
      <button id="modePlace" type="button" class="on">Размещение</button>
      <button id="modeFind" type="button">Где книга?</button>
    </div>
    <div class="cellbar" id="cellbar">
      <div><small>Ячейка</small><span class="cell" id="cellName">—</span></div>
      <div class="cellside"><span>На полке: <b id="shelfCount">0</b></span>
        <button id="doneBtn" class="done hidden" type="button">Полка готова</button></div>
    </div>
    <div id="status" class="status">
      <span class="lbl" id="stLbl">ГОТОВО</span>
      <span class="big hidden" id="stBig"></span>
      <span class="title" id="stTitle">Пикните этикетку ячейки</span>
      <span class="meta" id="stMeta"></span>
      <span class="note hidden" id="stNote"></span>
    </div>
    <div id="moveActions" class="actions hidden">
      <button id="moveNo" class="primary" type="button">Понятно, отнесу на место</button>
      <button id="moveHold" class="secondary" type="button"><span class="fill" id="holdFill"></span><span style="position:relative">Переместить сюда · удерживайте 2 секунды</span></button>
    </div>
    <div id="unknownActions" class="actions hidden">
      <button id="unkRefresh" class="primary" type="button">Обновить справочник и проверить ещё раз</button>
      <button id="unkSave" class="secondary" type="button">Всё равно сохранить (таблица проверит)</button>
    </div>
    <div id="pkgBlock" class="hidden">
      <div class="sec"><b>Упаковка</b><span id="pkgHint"></span></div>
      <div class="grid" id="pkgGrid"></div>
      <button id="pkgManual" class="wide" type="button">Ручная — ввести размеры</button>
      <div class="hint" id="pkgInfo"></div>
    </div>
    <div id="problems" class="problems hidden"></div>
    <div class="shelf" id="shelf"></div>
    <div class="spacer"></div>
    <div class="bottom">
      <button id="undoBtn" class="undo" type="button">Отменить последний</button>
      <button id="camBtn" class="cam-btn" type="button">Камера</button>
      <button id="menuBtn" class="menu-btn" type="button">Меню</button>
    </div>
  </section>
</div>

<div id="manualSheet" class="sheet hidden">
  <div class="box">
    <h2>Ручная упаковка, см</h2>
    <div class="step"><label for="mL">Длина</label><button type="button" data-d="L" data-s="-1" aria-label="Уменьшить длину">−</button><input id="mL" inputmode="numeric"><button type="button" data-d="L" data-s="1" aria-label="Увеличить длину">+</button></div>
    <div class="step"><label for="mW">Ширина</label><button type="button" data-d="W" data-s="-1" aria-label="Уменьшить ширину">−</button><input id="mW" inputmode="numeric"><button type="button" data-d="W" data-s="1" aria-label="Увеличить ширину">+</button></div>
    <div class="step"><label for="mH">Высота</label><button type="button" data-d="H" data-s="-1" aria-label="Уменьшить высоту">−</button><input id="mH" inputmode="numeric"><button type="button" data-d="H" data-s="1" aria-label="Увеличить высоту">+</button></div>
    <p id="mMsg" class="mmsg" role="alert"></p>
    <div class="row2"><button class="back" id="mBack" type="button">Назад</button><button class="ok" id="mOk" type="button">Готово</button></div>
  </div>
</div>

<div id="menuSheet" class="sheet hidden">
  <div class="box menu">
    <h2>Меню</h2>
    <button id="mSync" type="button">Отправить сейчас</button>
    <button id="mCatalog" type="button">Обновить справочник книг</button>
    <button id="mExport" type="button">Выгрузить неотправленное в файл</button>
    <button id="mKey" type="button">Сменить ключ устройства</button>
    <p id="mInfo" style="margin:0;font-size:13px;color:#52525b"></p>
    <button id="mClose" type="button">Закрыть</button>
  </div>
</div>

<div id="camSheet" class="cam hidden">
  <video id="camVideo" playsinline muted autoplay></video>
  <div class="frame" aria-hidden="true"></div>
  <div class="bar">
    <p id="camMsg">Наведите камеру на штрихкод</p>
    <button id="camClose" type="button">Закрыть</button>
  </div>
</div>

<input id="scan" inputmode="none" autocomplete="off" aria-label="Поле сканера">
<script src="app.js"></script>
</body>
</html>
